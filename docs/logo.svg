<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="deepmind-midi">
  <title>deepmind-midi</title>
  <!--
    A dark panel between wooden end cheeks, as on the unit. A MIDI DIN socket
    with the horizontal cuts the DeepMind wordmark uses, and an envelope.
  -->
  <defs>
    <clipPath id="case"><rect width="128" height="128" rx="24"/></clipPath>
    <clipPath id="cheeks">
      <rect x="0" width="13" height="128"/>
      <rect x="115" width="13" height="128"/>
    </clipPath>
    <mask id="cuts">
      <rect width="128" height="128" fill="#fff"/>
      <rect x="0" y="52" width="128" height="1.4" fill="#000"/>
      <rect x="0" y="57.5" width="128" height="2" fill="#000"/>
      <rect x="0" y="63.5" width="128" height="2.6" fill="#000"/>
      <rect x="0" y="70" width="128" height="3.2" fill="#000"/>
      <rect x="0" y="77" width="128" height="4" fill="#000"/>
    </mask>
  </defs>
  <g clip-path="url(#case)">
    <rect width="128" height="128" fill="#9b4a25"/>
    <!-- Wood grain: a few lines running the length of each cheek. -->
    <g clip-path="url(#cheeks)" fill="none" stroke-linecap="round">
      <g stroke="#7a3719" stroke-width="1.1" opacity="0.7">
        <path d="M 3 -4 C 2 30 5 60 3.5 90 S 3 120 4 132"/>
        <path d="M 8.5 -4 C 9.5 25 7 55 8.5 85 S 9.5 115 8 132"/>
        <path d="M 118.5 -4 C 117.5 30 120.5 60 119 90 S 118.5 120 119.5 132"/>
        <path d="M 124 -4 C 125 25 122.5 55 124 85 S 125 115 123.5 132"/>
      </g>
      <g stroke="#b85c30" stroke-width="0.8" opacity="0.6">
        <path d="M 5.8 -4 C 5 35 7 65 5.8 95 S 5.2 120 6 132"/>
        <path d="M 11 -4 C 11.5 40 10 70 11 100 S 11.5 125 10.8 132"/>
        <path d="M 121.4 -4 C 120.6 35 122.6 65 121.4 95 S 120.8 120 121.6 132"/>
        <path d="M 116.5 -4 C 117 40 115.5 70 116.5 100 S 117 125 116.3 132"/>
      </g>
    </g>
    <rect x="13" width="102" height="128" fill="#1e2128"/>
    <!-- The panel's rolled edges. -->
    <rect x="13" width="1.2" height="128" fill="#000" opacity="0.45"/>
    <rect x="113.8" width="1.2" height="128" fill="#000" opacity="0.45"/>
    <rect x="14.2" width="0.8" height="128" fill="#3a3f4b"/>
    <rect x="113" width="0.8" height="128" fill="#3a3f4b"/>
  </g>
  <circle cx="64" cy="50" r="28" fill="none" stroke="#d9dce3" stroke-width="5" mask="url(#cuts)"/>
  <g fill="#d9dce3">
    <circle cx="64" cy="32" r="3.4"/>
    <circle cx="51.3" cy="37.3" r="3.4"/>
    <circle cx="76.7" cy="37.3" r="3.4"/>
    <circle cx="46" cy="50" r="3.4"/>
    <circle cx="82" cy="50" r="3.4"/>
  </g>
  <polyline points="24,116 38,94 54,104 74,104 104,116" fill="none" stroke="#9fd8cf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
