<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="deepmind-midi">
  <title>deepmind-midi</title>
  <!--
    The unit seen from above: wooden end cheeks, a dark panel, and a bank of
    faders with the DeepMind's pale caps. The socket is the MIDI DIN; the
    faders sit on an envelope, as the ENVELOPES section of the panel does.
  -->
  <defs>
    <clipPath id="case"><rect width="128" height="128" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#case)">
    <rect width="128" height="128" fill="#9b4a25"/>
    <rect x="13" width="102" height="128" fill="#1e2128"/>
    <rect x="13" width="1.5" height="128" fill="#5d2d15" opacity="0.6"/>
    <rect x="113.5" width="1.5" height="128" fill="#5d2d15" opacity="0.6"/>
  </g>
  <!-- MIDI in: a five-pin DIN socket. -->
  <circle cx="64" cy="40" r="24" fill="none" stroke="#d9dce3" stroke-width="4"/>
  <g fill="#d9dce3">
    <circle cx="64" cy="25" r="3.2"/>
    <circle cx="53.4" cy="29.4" r="3.2"/>
    <circle cx="74.6" cy="29.4" r="3.2"/>
    <circle cx="49" cy="40" r="3.2"/>
    <circle cx="79" cy="40" r="3.2"/>
  </g>
  <!-- Four faders, attack to release, with their caps on the envelope. -->
  <g stroke="#4b5160" stroke-width="3" stroke-linecap="round">
    <line x1="32" y1="76" x2="32" y2="118"/>
    <line x1="53" y1="76" x2="53" y2="118"/>
    <line x1="74" y1="76" x2="74" y2="118"/>
    <line x1="95" y1="76" x2="95" y2="118"/>
  </g>
  <polyline points="21,118 32,80 53,96 74,96 95,116" fill="none" stroke="#9fd8cf" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/>
  <g fill="#b4e2da" stroke="#1e2128" stroke-width="1.2">
    <rect x="25.5" y="76.5" width="13" height="7" rx="1.8"/>
    <rect x="46.5" y="92.5" width="13" height="7" rx="1.8"/>
    <rect x="67.5" y="92.5" width="13" height="7" rx="1.8"/>
    <rect x="88.5" y="112.5" width="13" height="7" rx="1.8"/>
  </g>
</svg>
