name: Release

# Run this from the Actions tab. It tags and publishes whatever version
# Cargo.toml currently holds; it never edits the version itself.
#
# Bumping is a human step: edit `version` in the root Cargo.toml in a pull
# request. CI fails any pull request whose version is not ahead of the newest
# release tag, so the first one merged after a release has to move it.
#
# Publishing to crates.io authenticates one of two ways, tried in this order:
#
#   1. Trusted publishing. Configure it on the crate's settings page at
#      crates.io (owner MysteriousWolf, repository deepmind-midi, workflow
#      release.yml) and no secret is needed. crates.io only offers this for a
#      crate that already exists, so the first release cannot use it.
#   2. The CARGO_REGISTRY_TOKEN repository secret: a crates.io API token with
#      the publish-new and publish-update scopes. The first release needs it.
#
# With `publish` on and neither available, the run fails before tagging, so a
# version is never tagged and released without reaching crates.io.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to crates.io as well as tagging and releasing
        type: boolean
        default: true
      summary:
        description: Write a prose summary above the generated notes, using GitHub Models
        type: boolean
        default: true
      dry_run:
        description: Print the notes without tagging, releasing or publishing
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  models: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Never tag something that does not build, and never tag something
      # crates.io would then refuse: the dry run packages the crate, builds it
      # from the package and checks the registry metadata.
      - name: Verify
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features
          cargo test --workspace --all-features
          cargo publish --package deepmind-midi --dry-run

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^version = ' Cargo.toml | cut -d'"' -f2)
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::v${version} is already tagged. Bump the version in Cargo.toml first."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "releasing v${version}"

      # Trusted publishing first. The action fails when the crate has no
      # trusted publisher configured, which is expected before the first
      # release, so its failure is tolerated and the secret is tried next.
      - name: Authenticate with crates.io via trusted publishing
        if: ${{ inputs.publish && !inputs.dry_run }}
        id: trusted
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Choose a crates.io credential
        if: ${{ inputs.publish && !inputs.dry_run }}
        id: credential
        env:
          TRUSTED_TOKEN: ${{ steps.trusted.outputs.token }}
          SECRET_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TRUSTED_TOKEN:-}" ]; then
            echo 'using trusted publishing'
            echo "token=${TRUSTED_TOKEN}" >> "$GITHUB_OUTPUT"
          elif [ -n "${SECRET_TOKEN:-}" ]; then
            echo 'using the CARGO_REGISTRY_TOKEN secret'
            echo "token=${SECRET_TOKEN}" >> "$GITHUB_OUTPUT"
          else
            echo '::error::No crates.io credential. Configure trusted publishing on crates.io, add the CARGO_REGISTRY_TOKEN secret, or run again with publish off.'
            exit 1
          fi

      - name: Collect release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          WANT_SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          previous=$(git tag --list 'v*' --sort=-v:refname | head -n1)

          # GitHub's own notes, categorised by .github/release.yml.
          if [ -n "$previous" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="v${VERSION}" -f previous_tag_name="$previous" \
              --jq .body > generated.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="v${VERSION}" --jq .body > generated.md
          fi
          cp generated.md notes.md

          # Optional opening paragraph, written by a small model on GitHub Models
          # using the built-in token. Any failure leaves the generated notes as
          # they are.
          if [ "$WANT_SUMMARY" != 'true' ]; then
            echo 'summary not requested'
          else
            jq -n --arg notes "$(cat generated.md)" --arg v "$VERSION" '{
              model: "openai/gpt-4o-mini",
              messages: [
                { role: "system",
                  content: "You write release notes for a Rust library. Reply with two or three plain sentences of prose and nothing else: no heading, no bullet list, no closing line. Say what changed and who it affects. No marketing language, no em dashes." },
                { role: "user",
                  content: ("Version " + $v + " of deepmind-midi, a library for the Behringer DeepMind MIDI protocol.\n\n" + $notes) }
              ]
            }' > request.json

            if curl -sS --fail-with-body --max-time 60 \
                 https://models.github.ai/inference/chat/completions \
                 -H 'content-type: application/json' \
                 -H "authorization: Bearer ${GH_TOKEN}" \
                 -d @request.json > response.json; then
              jq -r '.choices[0].message.content // empty' response.json > summary.md
              if [ -s summary.md ]; then
                { cat summary.md; printf '\n\n'; cat generated.md; } > notes.md
              else
                echo '::warning::GitHub Models returned nothing, using the generated notes alone'
              fi
            else
              echo '::warning::GitHub Models request failed, using the generated notes alone'
              cat response.json || true
            fi
          fi

          echo '--- release notes ---'
          cat notes.md

      - name: Tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --notes-file notes.md

      - name: Publish to crates.io
        if: ${{ inputs.publish && !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.credential.outputs.token }}
        run: cargo publish --package deepmind-midi --no-verify
