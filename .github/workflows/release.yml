name: Release

# Run this from the Actions tab. It tags and publishes whatever version
# Cargo.toml currently holds; it never edits the version itself.
#
# Bumping is a human step: edit `version` in the root Cargo.toml in a pull
# request. CI fails any pull request whose version is not ahead of the newest
# release tag, so the first one merged after a release has to move it.
#
# Publishing to crates.io uses trusted publishing: GitHub mints a short-lived
# OIDC token for this workflow and crates.io exchanges it for a publish token,
# so the repository holds no long-lived credential. It is configured on the
# crate's settings page at crates.io, under Trusted Publishing:
#
#   repository owner    MysteriousWolf
#   repository name     deepmind-midi
#   workflow filename   release.yml
#   environment         (none)
#
# The owner and name must match this repository and the filename must match
# this file, or crates.io answers the exchange with 400 and no config found.
#
# Authentication happens before the tag is pushed, so a failed exchange leaves
# nothing tagged or released: fix the configuration and run again.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to crates.io as well as tagging and releasing
        type: boolean
        default: true
      dry_run:
        description: Print the notes without tagging, releasing or publishing
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Never tag something that does not build, and never tag something
      # crates.io would then refuse: the dry run packages the crate, builds it
      # from the package and checks the registry metadata.
      - name: Verify
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features
          cargo test --workspace --all-features
          cargo publish --package deepmind-midi --dry-run

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^version = ' Cargo.toml | cut -d'"' -f2)
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::v${version} is already tagged. Bump the version in Cargo.toml first."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "releasing v${version}"

      # Exchanges this run's OIDC token for a short-lived publish token.
      # Requires the `id-token: write` permission above and the trusted
      # publisher described at the top of this file; without the latter
      # crates.io answers 400 and the run stops here, before tagging.
      - name: Authenticate with crates.io
        if: ${{ inputs.publish && !inputs.dry_run }}
        id: trusted
        uses: rust-lang/crates-io-auth-action@v1

      - name: Collect release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          previous=$(git tag --list 'v*' --sort=-v:refname | head -n1)

          # GitHub's own notes, categorised by .github/release.yml.
          if [ -n "$previous" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="v${VERSION}" -f previous_tag_name="$previous" \
              --jq .body > notes.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="v${VERSION}" --jq .body > notes.md
          fi

          echo '--- release notes ---'
          cat notes.md

      - name: Tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --notes-file notes.md

      - name: Publish to crates.io
        if: ${{ inputs.publish && !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.trusted.outputs.token }}
        run: cargo publish --package deepmind-midi --no-verify

      # `cargo publish` leaves the crate unpacked under target/package, and the
      # cache action's cleanup walks into it looking for build directories that
      # a source tree does not have. Nothing needs it after this point. It also
      # walks what it restores, so a cache saved before this step existed keeps
      # reporting the same thing until one saved after it replaces it.
      - name: Remove the unpacked package
        if: always()
        run: rm -rf target/package
