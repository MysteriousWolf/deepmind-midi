name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The version guard below reads release tags from the local checkout.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The prefix was moved past the caches written before the cleanup step at
      # the end of this job existed. Those caches carry the source trees it
      # deletes, and restoring one brings the error annotations back with it.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      # The docs.rs build is the nightly job below; this is what a contributor
      # sees from `cargo doc` on stable, with broken links as errors.
      - name: Rustdoc on stable
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # Includes generated_documentation_is_current and generated_code_is_current,
      # which fail when docs/ or the library's parameter tables do not match spec/.
      - name: Test
        run: cargo test --workspace --all-features

      - name: Generated documentation is current
        run: cargo xtask docs --check

      - name: Generated parameter tables are current
        run: cargo xtask codegen --check

      # What the release workflow will publish: packages the crate, builds it
      # from the package and checks the registry metadata, without uploading.
      - name: Publishable
        run: cargo publish --package deepmind-midi --dry-run

      # The version scheme promises that a release within a year keeps the
      # public API, which this checks against the newest release tag. Nothing
      # to compare against before the first release.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Public API is compatible with the last release
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "no release tags yet"
            exit 0
          fi
          cargo semver-checks --package deepmind-midi --baseline-rev "$latest"

      # The first change merged after a release has to move the version.
      # A repository with no release tags yet passes: nothing to be behind.
      - name: Version is ahead of the last release
        run: |
          set -euo pipefail
          current=$(grep -m1 -E '^version = ' Cargo.toml | cut -d'"' -f2)
          latest=$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "$current (no release tags yet)"
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | head -1)" = "$current" ]; then
            echo "::error::Cargo.toml is at $current but v$latest is already released. Bump the version in Cargo.toml before merging."
            exit 1
          fi
          echo "$current is ahead of the last release, v$latest"

      # `cargo publish --dry-run` unpacks the crate under `target/package`, and
      # `cargo semver-checks` checks the baseline out under
      # `target/semver-checks/git-<tag>`. Both are source trees, and the cache
      # action walks everything under `target` twice: once on a restore that
      # was not an exact hit, and once before saving. Every directory named
      # `tests` it meets there it reads as a build profile and looks inside for
      # `tests/target` and `tests/trybuild`, which a source tree does not have.
      # It opens those without awaiting the result, so the failure escapes its
      # own error handling and lands on the job as an error annotation.
      #
      # Neither tree is worth carrying in the cache: one is written from the
      # working tree on every run, the other is a checkout of a tag. The
      # rustdoc caches beside the checkout, `target/semver-checks/local-*`, are
      # what makes the baseline cheap, and they hold no source, so they stay.
      - name: Drop the unpacked source trees from the target directory
        if: always()
        run: rm -rf target/package target/semver-checks/git-*

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      # Every combination of the six features, which is what keeps the
      # promises in the manifest true: the blocking adapter and the simulated
      # synthesizer need neither std nor an allocator, serde works without
      # std, the description tables compile in and out without changing a
      # signature, and the library builds with nothing on at all.
      - name: Every feature combination builds
        run: cargo hack check --package deepmind-midi --feature-powerset --no-dev-deps

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features

  fuzz:
    name: fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      # A short run on every change: a check that the targets still build and
      # nothing obvious regressed, which is what a pull request can afford. Real
      # campaigns run for hours against a corpus, locally or on a schedule.
      #
      # The explicit --target is not optional. `cargo fuzz` defaults to the
      # triple its own binary was built for, and the one installed here is
      # musl-linked, so without this it cross-compiles the targets against a
      # static libc and the sanitizer refuses: "sanitizer is incompatible with
      # statically linked libc". Reading the triple off rustc asks the
      # toolchain that will do the compiling.
      - name: Fuzz
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "building for $host"
          for target in decoder frame file program device; do
            echo "::group::$target"
            cargo fuzz run "$target" --target "$host" -- \
              -max_total_time=60 \
              -dict=fuzz/deepmind.dict \
              -print_final_stats=1
            echo "::endgroup::"
          done
        env:
          # Sanitizers set their own; -D warnings is for the build.
          RUSTFLAGS: -D warnings

      - name: Upload any crash
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build rustdoc
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings --cfg docsrs
