# Shapes the notes GitHub generates for a release.
# https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Protocol and specification
      labels: [spec, protocol]
    - title: Library
      labels: [library]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Tooling and CI
      labels: [tooling, ci]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
