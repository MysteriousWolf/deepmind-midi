group = "Control Sequencer"
glyph = "time"
min = 0
max = 15
enum = "sequencer_clock"
description = "Sets how fast the sequencer steps, as a division of the master tempo."
correction = "Section 8.1.8 lists twenty clock divisions against this range of 0-15. The range is left as printed and the value table is marked unconfirmed."

[[parameter]]
offset = 119
name = "Sequence Length"
group = "Control Sequencer"
glyph = "steps"
min = 0
max = 31
note = "1 (0) to 32 (31) steps"
description = "Sets how many of the 32 steps are played before the sequence returns to the first."
correction = "The manual runs the range and the first note value together as \"0-311 (0) to 32 (31) steps\". The range is 0-31."

[[parameter]]
offset = 120
name = "Sequencer Swing Timing"
group = "Control Sequencer"
glyph = "swing"
min = 0
max = 255
note = "0 is 50%, no swing. 255 is 75%, full swing. 66% is a triplet feel."
description = "Holds every second step back, which is what turns an even run of steps into a swung one."
display = "50% to 75%"
correction = "The NRPN note reads \"0% (0) to 75% (25)\". Sections 8.1.7 and 8.1.8 give the swing range as 50% to 75%, so 0 is 50% and 255 is 75%."

