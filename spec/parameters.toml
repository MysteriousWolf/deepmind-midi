group = "Oscillators"
glyph = "switch"
min = 0
max = 1
kind = "switch"
note = "Off (0), On (1)"
description = "Hard-syncs the oscillators, so that one restarts each time the other completes a cycle and its own pitch becomes a timbre control rather than a note."

[[parameter]]
offset = 21
