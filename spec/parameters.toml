group = "Oscillators"
glyph = "selection"
min = 0
max = 6
enum = "pitch_mod_source"
description = "Chooses what moves OSC 1's pitch: either LFO, one of the three envelopes, or an LFO taken unipolar so that it only bends one way."

[[parameter]]
offset = 23
name = "OSC 1 Aftertouch > Pitch Mod Depth"
group = "Oscillators"
glyph = "pressure"
min = 0
max = 255
description = "Sets how much aftertouch adds to OSC 1's pitch modulation depth, so that leaning on a held key deepens the vibrato."

[[parameter]]
offset = 24
name = "OSC 1 Mod Wheel > Pitch Mod Depth"
group = "Oscillators"
glyph = "mod wheel"
