glyph = "square"
min = 0
max = 255
description = "Sets how far OSC 1's pulse width moves. With a fixed source this is the width itself; with an LFO or an envelope it is how far that source sweeps it."
display = "50.0% to 99.0% pulse width when the source is Manual, otherwise 0 to plus or minus 49% modulation"

[[parameter]]
offset = 26
