group = "Oscillators"
glyph = "pitch"
min = 0
max = 2
enum = "osc_range"
description = "Sets the octave OSC 1 sounds at, in the organ footages the display prints: 16' is the lowest and 4' the highest."
correction = "The manual prints \"0-216' (0), 8' (1), 4' (2)\". The range is 0-2."

[[parameter]]
offset = 15
name = "OSC 2 Range"
group = "Oscillators"
glyph = "pitch"
min = 0
max = 2
enum = "osc_range"
description = "Sets the octave OSC 2 sounds at, in the organ footages the display prints: 16' is the lowest and 4' the highest."
correction = "Same run-together as offset 14. The range is 0-2."

[[parameter]]
