[[parameter]]
offset = 35
name = "Portamento mode"
group = "Oscillators"
glyph = "selection"
min = 0
max = 13
enum = "portamento_mode"
description = "Chooses how the slide behaves: whether it happens on every note or only where two overlap, whether its time or its rate is what stays fixed, and whether it is a fixed interval away rather than a slide at all."

[[parameter]]
offset = 36
name = "Pitch Bend Up Depth"
group = "Oscillators"
glyph = "bend"
min = 0
max = 48
shape = "bipolar"
centre = 24
description = "Sets how far the pitch bender bends when it is pushed up."
confirmed = false
display = "-24 to +24 semitones, where 24 is no bend. A negative depth inverts the wheel, so pushing up bends down."
correction = "The NRPN table gives a range of 0-24, but section 8.4.4 states both pitch bend depths run from -24 to +24, which is 49 values. Encoded as 0-48 with 24 as zero, matching how the manual encodes Global Transpose (0-96 for -48 to +48). Needs confirming against hardware."

[[parameter]]
offset = 37
name = "Pitch Bend Down Depth"
group = "Oscillators"
glyph = "bend"
min = 0
max = 48
shape = "bipolar"
centre = 24
description = "Sets how far the pitch bender bends when it is pulled down."
confirmed = false
display = "-24 to +24 semitones, where 24 is no bend. A negative depth inverts the wheel, so pulling down bends up."
correction = "Same as offset 36."

