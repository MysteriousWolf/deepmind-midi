group = "LFO 2"
glyph = "wave"
min = 0
max = 6
enum = "lfo_shape"
description = "Chooses the waveform LFO 2 runs: one of the four periodic shapes, or one of the two that pick a fresh random value each cycle."

[[parameter]]
offset = 10
name = "LFO 2 Key Sync"
group = "LFO 2"
glyph = "keys"
min = 0
max = 1
kind = "switch"
note = "Off (0), On (1)"
description = "Restarts LFO 2 at the start of its cycle on each new note, so every note is modulated the same way instead of catching the LFO wherever it had got to."

[[parameter]]
offset = 11
