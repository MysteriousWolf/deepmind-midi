[[parameter]]
offset = 85
name = "Polyphony Mode"
group = "Voicing"
glyph = "selection"
min = 0
max = 12
enum = "polyphony_mode"
description = "Chooses how the voices are handed out: one to a note, several stacked on each note in unison, a limited number of them at a time, or the whole instrument reduced to one voice."

[[parameter]]
offset = 86
name = "Envelope Trigger Mode"
group = "Voicing"
glyph = "selection"
min = 0
max = 3
enum = "key_assign_mode"
description = "Chooses whether the envelopes restart on each new note or run on from where they are when notes overlap, and whether they run once through however long the key is held."

[[parameter]]
offset = 87
name = "Unison Detune"
group = "Voicing"
glyph = "detune"
min = 0
max = 255
note = "Sets the amount phatness!"
description = "Sets how far the stacked voices of a unison mode are tuned apart from one another, which is what thickens the sound."
display = "plus or minus 0.0 to 50.0 cents"

[[parameter]]
offset = 88
name = "Voice Drift"
group = "Voicing"
glyph = "noise"
min = 0
max = 255
description = "Sets how much drift is applied per voice, which is what keeps two voices playing the same note from being identical."

[[parameter]]
offset = 89
name = "Parameter Drift"
group = "Voicing"
glyph = "noise"
min = 0
max = 255
description = "Sets how much drift is applied to parameter values, which is what keeps a setting from sounding exactly where it was left."

[[parameter]]
offset = 90
name = "Drift Rate"
group = "Voicing"
glyph = "rate"
min = 0
max = 255
description = "Sets how quickly drift moves from one random value to the next."
display = "Each drift step lasts a random time between 25-50 ms at 0 and 2.5-5.0 s at 255"

[[parameter]]
offset = 91
name = "OSC Portamento Balance"
group = "Voicing"
glyph = "glide"
min = 0
max = 255
shape = "bipolar"
centre = 128
note = "-128 (0) to +127 (255)"
description = "Sets how the portamento time is split between the two oscillators, so that one can arrive at the new note ahead of the other."

[[parameter]]
offset = 92
name = "OSC Key Down Reset"
group = "Voicing"
glyph = "keys"
min = 0
max = 1
kind = "switch"
note = "Off (0), On (1)"
description = "Restarts the oscillators' waveforms on each new note, so that every note begins from the same point in the cycle."

[[parameter]]
offset = 93
name = "Mod 1 Source"
group = "Mod Matrix"
glyph = "selection"
min = 0
max = 24
enum = "mod_source"
description = "Chooses what drives this modulation bus. Zero is off; the rest are the instrument's own controls, its envelopes, its LFOs and the control sequencer."
correction = "Firmware 1.1 added two modulation sources, raising the range from 0-22 to 0-24. The manual's NRPN table still prints the firmware 1.0 range."

