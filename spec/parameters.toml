correction = "The manual prints \"0-10 (OSC1+2), 1 (OSC 1 Only)\". The range is 0-1."

[[parameter]]
offset = 39
name = "VCF Frequency"
group = "VCF"
glyph = "high cut"
min = 0
max = 255
description = "Sets the cutoff frequency of the low pass filter, the point above which the oscillators' harmonics are removed. Turning it down darkens the sound."
display = "50.0 Hz to 20000.0 Hz"

[[parameter]]
offset = 40
name = "VCF HighPass Frequency"
group = "VCF"
glyph = "low cut"
min = 0
max = 255
description = "Sets the cutoff of the high pass filter, which removes what is below it. The manual's block diagram places this after the VCA, so it acts on the mixed voices rather than on one."
display = "20.0 Hz to 2000.0 Hz"

[[parameter]]
offset = 41
name = "VCF Resonance"
group = "VCF"
glyph = "resonance"
min = 0
max = 255
description = "Emphasises the frequencies around the low pass cutoff, which sharpens the filter's peak and thins out what sits below it."
display = "0.0% to 100.0%"

[[parameter]]
