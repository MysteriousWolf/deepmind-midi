group = "Oscillators"
glyph = "square"
min = 0
max = 1
kind = "switch"
note = "Off (0), On (1)"
description = "Adds OSC 1's pulse wave to the mix. It and the saw are independent, so either, both or neither can sound."

[[parameter]]
offset = 19
name = "OSC 1 Saw Enable"
group = "Oscillators"
glyph = "saw"
min = 0
max = 1
kind = "switch"
