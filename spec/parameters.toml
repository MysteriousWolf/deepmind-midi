# DeepMind program parameters.
#
# Generated documentation is built from this file. Edit it here, then run
# `cargo xtask docs` to refresh docs/midi-spec.md.
#
# `offset` is both the parameter's 14-bit NRPN number and its byte offset in
# an unpacked program dump. The two are the same number.

[meta]
source = "DeepMind 12 User Manual, section 17 (MIDI NRPN Commands)"
program_data_len = { v6 = 242, v7 = 245 }
reserved_offsets = "242-244, present only in protocol version 7, zero in all factory programs examined"
descriptions = """
The `description` on each parameter is written for this specification against
what the rest of it records - the signal path, the value tables, the notes and
the ranges - and is not a transcription of the manual. That is the opposite of
`spec/effects.toml`, whose descriptions are the manual's own words and are
credited in NOTICE; the manual's program parameter descriptions have not been
transcribed here. A parameter whose behaviour this specification does not
establish gets no description rather than a guessed one, and a description says
what the control does, never what a value decodes to - that is `note` and the
value tables."""

[[parameter]]
offset = 0
name = "LFO 1 Rate"
group = "LFO 1"
glyph = "rate"
min = 0
max = 255
note = "When LFO 1 Arp Sync is on, this selects a division of the master BPM from the LFO clock divider table instead of setting a free-running rate."
description = "Sets how fast LFO 1 runs, which is what the modulation depths elsewhere in the program are a depth of."
display = "0.041 Hz to 65.4 Hz, or up to 1280 Hz when driven from the modulation matrix"

[[parameter]]
offset = 1
name = "LFO 1 Delay / Fade"
group = "LFO 1"
glyph = "attack"
min = 0
max = 255
description = "Sets how long LFO 1 takes to reach full depth after a note starts, so that vibrato can arrive rather than being there from the attack."
display = "0.00 s to 6.59 s"

[[parameter]]
offset = 2
name = "LFO 1 Shape"
group = "LFO 1"
glyph = "wave"
min = 0
max = 6
enum = "lfo_shape"
description = "Chooses the waveform LFO 1 runs: one of the four periodic shapes, or one of the two that pick a fresh random value each cycle."

[[parameter]]
offset = 3
name = "LFO 1 Key Sync"
group = "LFO 1"
glyph = "keys"
min = 0
max = 1
kind = "switch"
note = "Off (0), On (1)"
description = "Restarts LFO 1 at the start of its cycle on each new note, so every note is modulated the same way instead of catching the LFO wherever it had got to."

[[parameter]]
offset = 4
name = "LFO 1 Arp Sync"
group = "LFO 1"
glyph = "time"
min = 0
max = 1
kind = "switch"
note = "Off (0), On (1)"
description = "Locks LFO 1 to the master tempo, which is what turns its rate into a choice of clock division rather than a speed."

[[parameter]]
offset = 5
name = "LFO 1 Mono Mode"
group = "LFO 1"
glyph = "selection"
min = 0
max = 255
enum = "lfo_mono_mode"
description = "Chooses whether each voice gets its own copy of LFO 1, whether all voices share one, or whether the voices' copies are spread apart in phase."
correction = "The manual prints 0-1, but its own note describes Poly (0), Mono (1) and SPREAD-1 (2) through SPREAD-254 (255), matching LFO 2 Mono Mode at offset 12."

[[parameter]]
offset = 6
name = "LFO 1 Slew Rate"
group = "LFO 1"
glyph = "curve"
min = 0
max = 255
description = "Rounds the corners off LFO 1's waveform, which turns a square into something that ramps between its two levels rather than jumping."

[[parameter]]
offset = 7
name = "LFO 2 Rate"
group = "LFO 2"
glyph = "rate"
min = 0
max = 255
note = "When LFO 2 Arp Sync is on, this selects a division of the master BPM from the LFO clock divider table instead of setting a free-running rate."
description = "Sets how fast LFO 2 runs, which is what the modulation depths elsewhere in the program are a depth of."
display = "0.041 Hz to 65.4 Hz, or up to 1280 Hz when driven from the modulation matrix"

[[parameter]]
offset = 8
name = "LFO 2 Delay / Fade"
group = "LFO 2"
glyph = "attack"
min = 0
max = 255
description = "Sets how long LFO 2 takes to reach full depth after a note starts, so that vibrato can arrive rather than being there from the attack."
