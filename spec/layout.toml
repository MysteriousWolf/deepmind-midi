# Where an effect's controls sit, and what colour its panel is.
#
# Generated documentation is built from this file. Edit it here, then run
# `cargo xtask docs` to refresh docs/effects.md and docs/diagrams/fx/*.svg.
#
# panels.toml says what a slot is: its name in full, its control kind, which
# slots belong together. This file says where it goes and what it looks like.
# The two are separate because they have different sources and different
# reliability: everything here is measured off a figure in the manual, and
# nothing here is needed to talk to the synthesizer.

[meta]
layout_source = """
The 35 screenshots of the synthesizer's own FX page in section 9.3 of the \
DeepMind 12 User Manual. Each draws one circle per slot. The circles were \
found by filling and labelling the ink in the printed screenshot, and their \
centres are the grid below."""
layout_result = """
All 35 pages agree exactly. Every circle centre falls on one of six columns \
and one of two rows, the count of circles matches the slot count for all 35 \
algorithms, and a row that is not full stops early rather than spreading or \
centring. So the layout is one grid, shared by every effect, filled in slot \
order from the top left."""
colour_source = """
The picture of the effect's own editor panel printed beside each screenshot \
in section 9.3. The panels differ per algorithm, so their colours are a fact \
about the effect rather than a house style."""
colour_method = """
Every pixel of an effect's panel pictures was quantised to a 16-level grid and \
the buckets ranked by coverage. `body` is the commonest colour. `panel` is the \
next one covering at least 3% that is far enough from `body` to read as a \
second surface, and equals `body` on a panel that has only one. `accent` is \
the most saturated colour still covering a visible share, which picks out a \
lit button, an LED or a label. Nine bytes per effect: no artwork is \
reproduced, and none is needed to render a panel from this file."""
aligns = ["left", "right", "centre", "spread"]

# The grid the synthesizer draws, in pixels of its 128x64 display.
#
# `align` says what a row that is not full does with the space left over.
# Measured as left on every row of every effect; the field exists so a host
# with a different panel width can say what it does instead.
[grid]
columns = 6
rows = 2
align = "left"
order = "slot"
control = "knob"
display_width = 128
display_height = 64
first_x = 13.5
first_y = 14.4
column_pitch = 20.0
row_pitch = 18.6
control_diameter = 11.9
control_note = """
The synthesizer draws every slot as a circle, switches and selectors \
included, and prints the slot's short name above it and its current value \
below. Control kind is in panels.toml; it changes the label, not the shape."""

