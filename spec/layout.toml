type = 0
name = "TC-DeepVRB"
category = "Reverb"
control = "knob"
chassis = "#5e667d"
face = "#5d6379"
cap = "#333945"
accent = "#424c68"
rows = [
    { slots = [1, 2, 3, 4, 5], align = "left" },
]

