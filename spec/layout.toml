# Where an effect's controls sit, and what colour its panel is.
#
# Generated documentation is built from this file. Edit it here, then run
# `cargo xtask docs` to refresh docs/effects.md and docs/diagrams/fx/*.svg.
#
# panels.toml says what a slot is: its name in full, its control kind, which
# slots belong together. This file says where it goes and what it looks like.
# The two are separate because they have different sources and different
# reliability: everything here is measured off a figure in the manual, and
# nothing here is needed to talk to the synthesizer.

[meta]
layout_source = """
The 35 screenshots of the synthesizer's own FX page in section 9.3 of the \
DeepMind 12 User Manual. Each draws one circle per slot. The circles were \
found by filling and labelling the ink in the printed screenshot, and their \
centres are the grid below."""
layout_result = """
All 35 pages agree exactly. Every circle centre falls on one of six columns \
and one of two rows, the count of circles matches the slot count for all 35 \
algorithms, and a row that is not full stops early rather than spreading or \
centring. So the layout is one grid, shared by every effect, filled in slot \
order from the top left."""
control_source = """
The same pictures. The panels are not all built from the same control: 29 use \
rotary knobs, 5 use vertical faders on a cream surface with a lit label strip, \
and the Vintage Room Reverb uses numeric displays with a single knob. \
`control` is which one, read off the picture. It is the shape the panel uses \
for a parameter that sweeps a range; a switch or a selector is drawn as a \
button whatever the panel, and which slots those are is in panels.toml."""
colour_source = """
The picture of the effect's own editor panel printed beside each screenshot \
in section 9.3. The panels differ per algorithm, so their colours are a fact \
about the effect rather than a house style."""
colour_method = """
Four colours are taken by where they sit rather than by coverage alone. \
`chassis` is the commonest colour in a band along the four edges, which is the \
case around the controls. `face` is the commonest in the middle, which is the \
surface the controls sit on. `cap` is the next surface in from `face`, \
skipping anything close to `face` or `chassis` and anything saturated enough \
to be a label or an indicator, which leaves the part a finger moves: a knob \
body or a fader cap. \
`accent` is the most saturated colour still covering a visible share: a label \
colour on a panel that has one, an LED on one that does not, and `cap` \
again on a panel with neither."""
colour_precision = """
Two details decide whether the numbers come out right. `face` and `cap` \
are measured on the picture shrunk eightfold, because a fader panel draws its \
travel as a ladder of thin dark lines across the whole surface and at full \
size those lines outvote the surface they are drawn on. And colours closer \
together than a threshold are merged before ranking, because a shaded surface \
spreads over several buckets while a flat one stays in one: without merging, \
the cream of a fader panel splits six ways and loses to its black label strip. \
Twelve bytes per effect, and no artwork is reproduced."""
aligns = ["left", "right", "centre", "spread"]
controls = ["knob", "fader", "display"]

# The grid the synthesizer draws on its FX page, in pixels of its 128x64
# display. Positions come from here; the shape drawn at each position comes
# from the effect's own editor panel, which is `control` on each layout below.
#
# `align` says what a row that is not full does with the space left over.
# Measured as left on every row of every effect; the field exists so a host
# with a different panel width can say what it does instead.
[grid]
columns = 6
rows = 2
align = "left"
order = "slot"
shape = "circle"
display_width = 128
display_height = 64
first_x = 13.5
first_y = 14.4
column_pitch = 20.0
row_pitch = 18.6
control_diameter = 11.9
shape_note = """
The synthesizer draws every slot as a circle, switches and selectors \
included, and prints the slot's short name above it and its current value \
below. That is the FX page. What the effect's own editor panel uses instead \
is `control` on each layout, and the two disagree: five effects are faders \
there and circles here."""

