# A glyph per thing a parameter does, for a display with room for a picture
# beside a value and not for a sentence.
#
# Generated documentation is built from this file. Edit it here, then run
# `cargo xtask docs` to refresh docs/effects.md and docs/diagrams/glyphs.svg,
# and `cargo xtask codegen` to refresh the tables that carry the glyphs.
#
# A parameter has a name, a range and, from #24, a shape. What it did not have
# is a picture of what turning it does: that a `Decay` is a tail falling away,
# that a `Mix` is wet against dry, that a `Low Cut` is the lows taken off. On
# the instrument's own display, and on the small one a controller has beside
# each of its knobs, a picture and a bar say what a sentence has no room to.
#
# Three tables reach these. Every effect slot names one in panels.toml, because
# what a slot does depends on the algorithm and the algorithm is the only thing
# that knows. A program parameter names one in parameters.toml where one fits.
# A controller names one in controllers.toml where one fits. And a modulation
# source cell in cells.toml may point at one rather than draw its own, so the
# mod wheel is one drawing whether it is met as a source, a controller or a
# parameter.

[meta]
language = """
The same seven by seven grid the effect marks and the source cells are drawn \
on, one bit a dot, drawn by hand for the reason marks.toml gives: at forty-nine \
dots which of them are lit is the whole of the design. Each glyph is a diagram \
of one idea and not a picture of a control. A level is a wedge, because that is \
how the travel of a fader is printed; a time is a clock; a cut is a corner, \
turned the way the response goes. The envelope stages are the segment itself \
with enough of its neighbours to say which one it is, so a host with a row of \
four knobs draws four different pictures over them rather than four envelopes."""
choice = """
Which glyph a parameter carries is this project's reading, the same way the \
`quantity` column in panels.toml is: derived from what the parameter does, \
which the unit and the manual's description settle, and never from what it is \
called. Where two parameters do the same thing to a signal they carry the same \
glyph: every `Low Cut` is a low cut, whether it is on a reverb or a delay. A \
parameter that has no glyph because none would say more than its name does is \
left without one rather than given a nearly-right one."""
counts = """
Some glyphs stand for a whole class: `selection` is any list of named options, \
`switch` is any in-or-out, `steps` is anything that goes in steps. A host that \
wants to tell a preset from a cabinet has the parameter's own values for that; \
the glyph says what kind of thing is being chosen, not which."""

