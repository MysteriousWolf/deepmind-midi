firmware = "1.1+"
name = "FX Type"
note = """
Every value is an effect. The instrument has no slot-level off: section 7.2.4 \
of the manual, "To load an effect into a slot ... select from one of the \
following effects", lists exactly these 35 and no Off, None or Thru entry, and \
the effects table in section 9.1 gives the same 35. `FX n Type` is declared \
0-34 to match. What takes effects out of circuit is `FX Mode = Bypass`, and \
