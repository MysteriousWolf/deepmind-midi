[[enum]]
id = "mod_destination"
firmware = "1.1+"
name = "Modulation Matrix Destination"
note = """
The Moves column joins each destination to the program parameters it reaches, \
so that a host holding `Mod 3 Destination = 20` can say that the byte it \
addresses is offset 39. It is this project's reading of the abbreviations the \
display prints, checked against the parameter table, not a mapping the manual \
publishes. A blank there is deliberate: the destination names something no \
program parameter holds, such as the pitch a key is playing or the amplitude \
of one voice, and the Notes column says which. Several destinations plainly \
move more than one parameter, which is why this is a list."""
