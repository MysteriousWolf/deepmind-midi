# DeepMind effect parameters, by algorithm.
#
# Generated documentation is built from this file. Edit it here, then run
# `cargo xtask docs` to refresh docs/midi-spec.md.
#
# Each FX engine holds twelve raw parameter bytes. What they mean depends on
# the algorithm that engine is running, which is why this table exists. `type`
# joins to the fx_type value table in enums.toml.

[meta]
source = "DeepMind 12 User Manual, section 9.3 (Effects Parameters)"
engine_offsets = [167, 180, 193, 206]
slots_per_engine = 12
note = """
Ranges are what the synthesizer displays, not raw wire values; every raw
parameter is a byte. The manual gives no raw-to-display mapping, so the two
ends are recorded and the curve between them is not yet known."""

[[effect]]
type = 0
name = "TC-DeepVRB"
full_name = "TC Deep Reverb"
parameters = [
    { slot = 1, ref = "PST", name = "Preset", values = "Ambience, Church, Gate, Hall, Lo Fi, Modulated, Plate, Room, Spring, Tile, Default" },
    { slot = 2, ref = "DCY", name = "Decay", unit = "s", min = "0.1", max = "6.0", mod_dest = true, description = "Controls the amount of time it takes for the reverb to dissipate (range is preset dependant)." },
    { slot = 3, ref = "TON", name = "Tone", unit = "%", min = "-50.0", max = "50.0", mod_dest = true, description = "Enhances high frequencies/low frequencies for positive/negative settings respectivly." },
    { slot = 4, ref = "PDY", name = "PreDelay", unit = "ms", min = "0.0", max = "200.0", description = "Controls the amount of time before the reverb is heard following the source signal." },
    { slot = 5, ref = "MIX", name = "Mix", unit = "%", min = "0.0", max = "100", mod_dest = true, description = "Controls the mix (or ratio) of wet (processed) and dry (unprocessed) signals." },
]

[[effect]]
type = 1
name = "AmbVerb"
full_name = "Ambient Reverb"
parameters = [
    { slot = 1, ref = "PD", name = "PreDelay", unit = "ms", min = "0.0", max = "200.0", description = "Controls the amount of time before the reverb is heard following the source signal." },
    { slot = 2, ref = "DCY", name = "Decay", unit = "s", min = "0.2", max = "7.3", mod_dest = true, description = "Controls the amount of time it takes for the reverb to dissipate." },
    { slot = 3, ref = "SIZ", name = "Size", min = "2.0", max = "100.0", description = "Controls the perceived size of the space being created by the reverb." },
    { slot = 4, ref = "DMP", name = "Damping", unit = "Hz", min = "1000", max = "20000", mod_dest = true, description = "Adjusts the decay of the high frequencies within the reverb tail." },
    { slot = 5, ref = "DIF", name = "Diffusion", min = "1.0", max = "30.0", description = "Controls the initial reflection density." },
    { slot = 6, ref = "MIX", name = "Mix", unit = "%", min = "0.0", max = "100", mod_dest = true, description = "Controls the mix (or ratio) of wet (processed) and dry (unprocessed) signals." },
    { slot = 7, ref = "LC", name = "LoCut", unit = "Hz", min = "10.0", max = "500.0", mod_dest = true, description = "Allows the low frequencies affected by the reverb to be reduced." },
    { slot = 8, ref = "HC", name = "Hi Cut", unit = "Hz", min = "200.0", max = "20000.0", mod_dest = true, description = "Allows the high frequencies affected by the reverb to be reduced." },
    { slot = 9, ref = "MOD", name = "Mod", unit = "%", min = "0.0", max = "100", description = "Controls the reverb tail modulation depth." },
    { slot = 10, ref = "TGN", name = "TailGain", unit = "%", min = "0.0", max = "100", mod_dest = true, description = "Adjusts the volume of the reverb tail." },
]

