# MIDI continuous controllers.
#
# Generated documentation is built from this file. Edit it here, then run
# `cargo xtask docs` to refresh docs/midi-spec.md.
#
# Controllers are 7-bit, so a CC reaches 128 of the 256 values an NRPN can
# address. Use NRPN where resolution matters.

[meta]
source = "Community controller map for the DeepMind 12, cross-checked against the DeepMind 12D MIDI Designer layout"
resolution = "7-bit, 0-127"

