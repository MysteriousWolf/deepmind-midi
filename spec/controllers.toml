name = "VCA Envelope Sustain Level"
kind = "parameter"
parameter = 55
confirmed = false
note = "The source list labels CC 44 \"VCA S\" and CC 56 \"VCA Scrv\" and omits CC 40 and CC 52 entirely. Controllers 37-49 run as three envelopes of attack, decay, sustain, release and 50-61 as the same three sets of curves, which puts VCA sustain at 40, VCF sustain at 44, VCA sustain curve at 52 and VCF sustain curve at 56. The run is encoded here; confirm against hardware."

