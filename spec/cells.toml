# A dot-matrix cell per modulation source, and per destination a parameter
# cannot answer for, so that a patch bay is drawn in pictures.
#
# Generated documentation is built from this file. Edit it here, then run
# `cargo xtask docs` to refresh docs/midi-spec.md and the sheet of cells each
# table is drawn in docs/diagrams/, and `cargo xtask codegen` to refresh the
# value tables that carry the cells.
#
# A modulation source, and a destination the parameter table cannot picture,
# has a name the display prints and, from here, a picture: seven dots by seven,
# one bit a dot, the size the instrument's own 128 by 64 display has room for
# beside a name and the size a host lays down at any scale without resampling
# anything. It is the same grid the effect family marks are
# drawn again on in marks.toml and the parameter glyphs are drawn on in
# glyphs.toml, reached through the same `Pixels` type, and it reaches a host
# through `ValueTable::cell_of`.
#
# A cell either draws its own `pixels` or names a `glyph` from glyphs.toml.
# The wheels, the pedals, the pressure and the velocity are things a parameter
# and a controller are pictured by too, and one drawing serves all three so
# that the mod wheel looks the same wherever it is met.

[meta]
purpose = """
Eight rows of source, destination and depth read one sentence each. A patch \
bay with the sources down one side and the destinations down the other adds \
the shape: that one LFO drives three things, that two routings are fighting \
over the filter corner, that the aftertouch goes nowhere. Two columns of \
abbreviations with lines between them is read word by word; two columns of \
pictures is read at a glance. A picture of `LFO 1` is a fact about the \
instrument, so it is published here and every host draws the same one."""
addressing = """
A cell names its table and its entry by the name the entry carries, which is \
how the value tables join across firmware versions: `Note Off Vel` on 1.1 and \
`NoteOff Vel` on 1.0 are one entry and one cell. The loader checks that every \
cell lands on an entry that exists and that no entry is drawn twice."""
language = """
Cells and not marks: a stroke drawing rasterised into forty-nine dots is a \
drawing whose author never saw what it came out as, so these are drawn dot by \
dot, the way the pixel grids in marks.toml are. Where an entry has a number, \
the number is a count of dots in the top right corner: one for `LFO1`, two for \
`LFO2`, three for `Env 3` and for `Env3 Rates`. A digit does not fit beside a picture at this size, \
and a count reads at a glance where a digit would be read.

An LFO is a sine crossing the middle; taken unipolar it is an arch on a floor, \
which is what riding up from the floor looks like. An envelope rises fast and \
falls slowly; a fade rises and stays up, which is the whole difference between \
the two. The wheels are a wheel seen from the side with its rest position \
filled: the pitch bender's in the middle, the modulation wheel's at the bottom. \
A velocity is an arrow with motion beside it, a pressure is an arrow pressing \
on a key, a release velocity is the first arrow turned round. The note number \
is a note, the sequencer is a row of steps, and the three axes of the joystick \
are the letters the display prints for them, because `X` is the picture of \
`X`.

A cell that names a glyph is that glyph, drawn as glyphs.toml draws it and \
carrying nothing extra, so that the `All Attack` a host reads off the entry \
and the `Env2 Attack` it reaches through the parameter table are one picture. \
A cell drawn here may carry a count, and the counted drawings are the ones \
this file owns: the LFOs, the envelopes and the envelope curves. On one of \
those, no count means the whole family rather than any one of them, which is \
what `Env Rates` is."""
pedals = """
`Foot Ctrl` and `Expression` are both pedals, and the two cells say what each \
is for rather than drawing one pedal twice. The foot controller is the \
treadle: a plate over its base, tipped by the toe, which is what the \
instrument's own pedal input takes. Expression is the same treadle filled in, \
because what an expression pedal carries by definition is a level, and a level \
is drawn filled everywhere in this crate. The sustain pedal is a different \
thing again, a switch under a foot, and it has a glyph of its own, \
`footswitch`, for the controller table; it is not a modulation source, so it \
is not here."""
voices = """
`Voice Num` is which of the instrument's voices a note was given and \
`Uni Voice` is which voice of a unison stack is playing one note. Neither is a \
shape, so each is drawn as what it is: a row of cells with one of them inked, \
and the same cells piled up rather than laid along, because a unison stack is \
one note's voices on top of each other. `BreathCtrl` is drawn by the `breath` \
glyph, air down a tube, which the breath controller on CC 2 carries too: one \
drawing whether it is met as a source or as a controller."""
destinations = """
A destination is drawn here only where reaching through it leaves a host with \
nothing to draw. 113 of the 133 name one program parameter, and the picture of \
one of those is that parameter's own glyph, kept in one place so that an \
attack is an attack wherever it is met; the name beside the cell says which \
envelope's it is, the way it says which oscillator's pitch a note stands for.

Eleven name a set of parameters on purpose, with no one of them the narrowest: \
`All Attack` is three envelopes' attack and the picture of that is an attack, \
drawn once on the entry. Eight name something no program parameter holds — a \
pitch as it is played, the amplitude or the pan of one voice — and those are \
the ones a host can neither light a control for nor reach a glyph through, so \
they are drawn here or nowhere."""
undrawn = """
`Off` carries none at either end of the matrix: that is the table saying this \
end is not wired, and a picture of nothing is a picture.

The 48 `FX n Param m` destinations carry none either, and that is the one \
deliberate gap left. What `FX 1 \
Param 3` is depends on which algorithm its engine is running, so a fixed \
picture would be wrong five times out of six. The right picture is the slot's \
own glyph under the loaded algorithm, which `Engine::of` and \
`Algorithm::slot_of` reach, and the coarser one is that algorithm's mark. Both \
are facts about the engine rather than about the parameter, so neither is \
written down here and `ParamId::glyph` answers `None` for all 48 by design."""

