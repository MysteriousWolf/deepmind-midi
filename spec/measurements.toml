# Raw parameter values paired with what the synthesizer displays for them.
#
# Generated documentation is built from this file. Edit it here, then run
# `cargo xtask docs` to refresh docs/midi-spec.md.
#
# The manual gives each parameter's displayed range but not the shape between
# its ends. These are readings taken off the middle of that range, so a curve
# can be tested rather than assumed.
#
# They are observations, not conversions. Nothing in the library converts a raw
# value to a displayed one on the strength of a row here; that waits for a
# measured curve. What these do is decide which curves are still possible, and
# give a future measurement pass something to check itself against.

[meta]
source = """
PROG screenshots printed beside the fader descriptions in section 8 of the \
DeepMind 12 User Manual, plus the worked example in section 7.1."""
method = """
Section 7.1.7 of the manual calls the upper number on the PROG screen the \
CURRENT PARAMETER MIDI VALUE and says it is "a simple value (0-255)", which is \
the value on the wire. Section 7.1.8 calls the lower, reverse-video number the \
stored value, and 7.1.9 says the line along the bottom of the screen gives "a \
more accurate value of the parameter being adjusted" with its units. So every \
screenshot of that screen is a raw value printed next to its displayed value. \
Only the upper number is used here."""
exception = """
The arpeggiator tempo screen is not one of these. Its box reads 256 where the \
line below reads 256.0 BPM, and 256 is outside the 0-255 the MIDI value uses, \
so that screen shows BPM in both places. Tempo readings are left out."""
precision = """
`fit` names the interpolation between the parameter's two stated ends that \
reproduces the reading. Agreement is only ever to the last digit the screen \
prints, because the stated ends are themselves printed rounded. `endpoint` is a \
reading at one end, which confirms the end rather than the shape. `untested` is \
a reading the manual states no range for, so there is nothing to test it \
against; it is recorded because it is the only figure there is. `none` means \
neither linear nor exponential between the stated ends comes close."""
fits = ["linear", "exponential", "piecewise", "endpoint", "untested", "none"]

[[measurement]]
offset = 0
raw = 0
shown = "24.1 s"
fit = "endpoint"
note = "The slowest rate. A period of 24.1 s is 0.0415 Hz, agreeing with the 0.041 Hz the parameter table gives as the bottom of the range."

[[measurement]]
offset = 0
raw = 12
shown = "17.0 s"
fit = "exponential"
note = "Exponential in frequency between the ends, not in period. Linear in frequency would show 0.32 s here."

