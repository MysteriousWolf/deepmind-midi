# A mark per effect family, as geometry rather than as artwork.
#
# Generated documentation is built from this file. Edit it here, then run
# `cargo xtask docs` to refresh docs/effects.md and docs/diagrams/marks.svg.
#
# An effect already has a name, a full name, a category, twelve named slots, a
# grid position, a control shape and four measured colours. What it did not have
# is a small symbol that says *delay* or *filter* without being read, for a host
# drawing four engines at once with room for a word or a symbol but not both.
#
# Three things live here. `family` is what an effect does to a signal, as a
# closed set, which is the part with no pixels in it at all. `strokes` is the
# mark drawn as geometry, for any size a host can stroke a line at. `pixels` is
# the same mark drawn again by hand for a display too small to stroke anything.

[meta]
families = """
`category` in layout.toml is the four buckets the manual's own table of \
contents uses, and `Creative` holds the phaser, the pitch shifter and the \
rotary speaker, which want three different marks. A family is the same kind of \
published fact at the resolution a symbol needs. The two are kept separate \
rather than one replacing the other: a host that wants to reproduce the \
manual's grouping still can."""
assignment = """
Every algorithm is in exactly one family, which the spec loader checks against \
effects.toml by name, so an algorithm added without a family is an error rather \
than one quietly drawn as a reverb.

The three that are not a single effect are placed by what dominates them, which \
is also where the manual's own category puts them: Chorus and Reverb, Delay and \
Reverb and Flange and Reverb are reverbs, and Mod, Delay and Reverb is a delay. \
The Enhancing EQ is a filter and not a distortion: its nine slots are a gain, a \
frequency and a Q per band. Auto-Panning is imaging and not modulation: what \
its LFO moves is stereo position."""
language = """
The marks are diagrams rather than pictures, and they are diagrams of one idea \
each rather than of the effect. A reverb is not a drawing of a decaying tail; \
it is a source with two wavefronts leaving it. A compressor is not a transfer \
curve; it is a level with a ceiling and a floor around it. What a symbol has to \
do at twelve pixels is be told apart from the other eight, and a faithful small \
drawing loses that fight to a reduced one.

So the whole set is built from five things and nothing else: a straight run, a \
circular arc, a sine, a filled dot, and a corner between two runs. Nothing is \
filled except the dots, and no path closes except the rotary ring. Line weight \
is the host's and is the same for every mark, which is what makes them read as \
one set.

Two pairs are deliberately each other's transpose, because the things they \
describe are: Dynamics is a gap between two horizontal limits, Imaging is a \
span between two vertical ones. Reverb and Rotary are the only marks with \
curves in them, and they are told apart by the ring being closed."""
geometry = """
A unit box with the origin at the top left and y increasing downward, which is \
the convention every drawing API named here uses. Coordinates are kept inside \
0.08 to 0.92 so that a host's stroke width does not clip at the edge of the \
box.

`line` is a polyline of two or more points. `arc` is a circular arc, whose \
`start` and `sweep` are in turns clockwise from three o'clock, matching the \
y-down box; only the part actually swept has to be inside the box, so an arc \
may be taken from a circle that is not. `dot` is a filled disc, and is the one \
thing here that is filled rather than stroked.

`wave` is a sine along the line from `start` to `end`, displaced \
perpendicular to it by `amplitude` and repeating `cycles` times. It is a \
function rather than a set of points on purpose: a modulation mark drawn as a \
polyline is a row of corners, and how finely to sample a curve is a question \
about the size the host is drawing at, which this file does not know. The \
perpendicular is the start-to-end direction turned a quarter turn \
anticlockwise, so a positive sine rises on screen."""
pixels = """
The same nine marks drawn again on a seven by seven grid, one bit per pixel, \
for a display with no room to stroke anything: an LCD row beside an effect \
name, or a hardware panel.

Drawn by hand rather than rasterised from the strokes. At forty-nine pixels \
legibility is a question of which pixels, not of scale, and a one-pixel stroke \
put through a rasteriser at this size comes out as a grey smear with the idea \
gone. Every mark here was checked at size before it was written down, and three \
were redrawn because they did not survive it.

Seven is odd, so every mark has a true centre pixel to hang symmetry on, and it \
is the smallest grid that fits the ring with a middle in it. A host wanting a \
bigger icon has the strokes; this is for where the strokes cannot go."""
reuse = """
Nine marks for 35 algorithms. Every reverb is one mark and the six delays are \
one mark, because the difference between a Hall Reverb and a Plate Reverb is \
not something a symbol at twelve pixels can carry, and a drawing that implied \
it would be a guess about which reverb this is. The name is what tells them \
apart, and the library already publishes that."""
not_artwork = """
No font, no raster and no licensed symbol set. Nothing here is measured off the \
manual, unlike the panel colours: these are drawn by this project, and they are \
a reading of what each family does rather than a reproduction of anything \
Behringer prints. Where a mark goes is the host's layout, the same way the grid \
is data and the pixel size is not."""

[[family]]
name = "Reverb"
description = "One arrival and the room answering it, as a source with two wavefronts leaving."
algorithms = [
    "TC-DeepVRB",
    "AmbVerb",
    "RoomRev",
    "VintageRev",
    "HallRev",
    "ChamberRev",
    "PlateRev",
    "RichPltRev",
    "GatedRev",
    "Reverse",
    "ChorusVerb",
    "DelayVerb",
    "FlangVerb",
]
strokes = [
    { dot = { centre = [0.15, 0.50], radius = 0.06 } },
    { arc = { centre = [0.10, 0.50], radius = 0.30, start = -0.15, sweep = 0.30 } },
    { arc = { centre = [0.10, 0.50], radius = 0.62, start = -0.11, sweep = 0.22 } },
]
pixels = [
    ".......",
    "..#.#..",
    "...#.#.",
    "#..#.#.",
    "...#.#.",
    "..#.#..",
    ".......",
]

[[family]]
name = "Delay"
description = "The same sound three times and quieter each time, as three falling marks."
algorithms = [
    "Delay",
    "3TapDelay",
    "4TapDelay",
    "T-RayDelay",
    "DecimDelay",
    "ModDlyRev",
]
strokes = [
    { line = [[0.14, 0.12], [0.14, 0.88]] },
    { line = [[0.50, 0.40], [0.50, 0.88]] },
    { line = [[0.86, 0.66], [0.86, 0.88]] },
]
pixels = [
    ".......",
    "#......",
    "#......",
    "#..#...",
    "#..#...",
    "#..#..#",
    "#..#..#",
]

[[family]]
name = "Modulation"
description = "The wave that does the sweeping, one cycle of it."
algorithms = ["Chorus", "Chorus-D", "Flanger", "Phaser"]
strokes = [
    { wave = { start = [0.08, 0.50], end = [0.92, 0.50], amplitude = 0.36, cycles = 1.0 } },
]
pixels = [
    ".......",
    ".##....",
    "#..#...",
    "#..#..#",
    "...#..#",
    "....##.",
    ".......",
]

[[family]]
name = "Filter"
description = "A corner: level up to a point, and falling away after it."
algorithms = ["MidasEQ", "Enhancer", "MoodFilter"]
strokes = [
    { line = [[0.08, 0.24], [0.46, 0.24], [0.92, 0.82]] },
]
pixels = [
    ".......",
    "####...",
    "....#..",
    ".....#.",
    "......#",
    ".......",
    ".......",
]

[[family]]
name = "Dynamics"
description = "A level held between a ceiling and a floor, and the room left between them."
algorithms = ["FairComp", "NoiseGate"]
strokes = [
    { line = [[0.08, 0.12], [0.92, 0.12]] },
    { line = [[0.08, 0.88], [0.92, 0.88]] },
    { line = [[0.50, 0.34], [0.50, 0.66]] },
]
pixels = [
    "#######",
    ".......",
    "...#...",
    "...#...",
    "...#...",
    ".......",
    "#######",
]

[[family]]
name = "Distortion"
description = "A wave with the curve driven out of it: two levels and hard corners."
algorithms = ["MulBndDist", "RackAmp"]
strokes = [
    { line = [
        [0.08, 0.82],
        [0.24, 0.82],
        [0.24, 0.18],
        [0.54, 0.18],
        [0.54, 0.82],
        [0.92, 0.82],
    ] },
]
pixels = [
    ".......",
    ".###...",
    ".#.#...",
    ".#.#...",
    ".#.#...",
    "##.####",
    ".......",
]

[[family]]
name = "Imaging"
description = "A width, measured: a span with a mark at each end of it."
algorithms = ["EdisonEX1", "Auto Pan"]
strokes = [
    { line = [[0.08, 0.50], [0.92, 0.50]] },
    { line = [[0.08, 0.28], [0.08, 0.72]] },
    { line = [[0.92, 0.28], [0.92, 0.72]] },
]
pixels = [
    ".......",
    ".......",
    "#.....#",
    "#######",
    "#.....#",
    ".......",
    ".......",
]

[[family]]
name = "Pitch"
description = "A step to another pitch and held there: one level, a riser, another level."
algorithms = ["DualPitch", "Vintage Pitch"]
strokes = [
    { line = [[0.08, 0.74], [0.50, 0.74], [0.50, 0.26], [0.92, 0.26]] },
]
pixels = [
    ".......",
    "...####",
    "...#...",
    "...#...",
    "####...",
    ".......",
    ".......",
]

[[family]]
name = "Rotary"
description = "A driver going round: a ring with its centre marked."
algorithms = ["RotarySpkr"]
strokes = [
    { arc = { centre = [0.50, 0.50], radius = 0.38, start = 0.0, sweep = 1.0 } },
    { dot = { centre = [0.50, 0.50], radius = 0.07 } },
]
pixels = [
    "..###..",
    ".#...#.",
    "#.....#",
    "#..#..#",
    "#.....#",
    ".#...#.",
    "..###..",
]
