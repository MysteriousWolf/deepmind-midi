# How each effect presents its twelve slots.
#
# Generated documentation is built from this file. Edit it here, then run
# `cargo xtask docs` to refresh docs/effects.md.
#
# This file is semantic. It says what a slot is called in full, what kind of
# control it is, and which slots belong together, so a host can lay out a panel
# that behaves like the hardware. Where a slot goes and what colour it is are a
# different question with a different source, and live in layout.toml.

[meta]
titles = """
The manual names parameters as the synthesizer's display does, abbreviated to \
fit: HiSvFreq, LMF Spread, Rtype. effects.toml keeps those verbatim, for a host \
that wants to label a compact view exactly as the hardware does. `title` here \
is the same parameter written out, expanded by this project, for a panel with \
room to be readable."""
derivation = """
Control kind comes from the parameter itself: a slot with two states is a \
switch, one that picks from a list is a selector, one with a numeric range \
is continuous. Grouping comes from the parameter names, which mark the side \
of a stereo or dual engine (L/M and R/S on the compressor, the trailing 1 \
and 2 on the pitch shifters) or the band of an equaliser. Both are derived \
from effects.toml rather than transcribed, so they are conventions this \
project chose, not facts about the hardware."""
kinds = ["continuous", "switch", "selector"]
quantities = ["time", "frequency", "gain", "feedback", "depth", "position", "shape", "switch", "selection"]
quantity = """
`kind` says what control to draw. `quantity` says what the slot does to a \
signal, which is a different question with a different answer: a Mix, a \
Feedback and a Pre-Delay are all a byte 0-255 and they do three unrelated \
things to a picture. It is what lets a host group an algorithm's slots without \
matching on titles across 35 algorithms, which is the transcription this \
project exists to prevent.

Derived from the parameter, like `kind` and `group`, and so a convention this \
project chose rather than a fact the manual states. The unit decides it where \
there is one: ms and s are a time, Hz a frequency, dB a gain, degrees a \
position. Where there is not, the name decides, and where the name reads the \
other way from the manual's own description the description wins. Those are \
listed in the generator that produced this column, and the ones worth knowing \
are: a reverb's `Attack` is a shape, because the manual calls it the contour of \
the reverberation envelope rather than a time; `DC Bias` on the compressor is a \
shape, because it is the ratio and knee of the compression curve rather than a \
stereo position; and `EnvSpd` on the auto-panner is a depth, because it is how \
much the envelope modulates the rate rather than a rate itself.

`selection` is not one of the seven a quantity was first drawn up as. It is \
needed because a slot that picks from a list of named kinds - a preset, a \
cabinet, a distortion type - is not a quantity at all, and something has to be \
returned for it. `position` is the other addition: a pan, a width and a spread \
belong in a picture of the stereo field and not in one of how much effect there \
is.

A `Factor` on a delay is a time, not a selection, although it is drawn as a \
selector: what it sets is the tap's delay against the master time. That is the \
whole point of the column being separate from `kind`."""
enable = """
Three algorithms carry their own bypass in one of their twelve bytes: the \
Stereo Imaging and Chorus D `ON` slots, whose manual entry reads "Allows the \
effect to be turned On or Off", and the Noise Gate `PWR` slot, "Enables gate in \
the signal path. When switched off, gate is bypassed". `enable` marks those \
three, so a host can grey a slot it knows is doing nothing without matching on \
`ON` and `PWR` as strings.

It marks a switch that takes the whole effect out of circuit, and nothing \
weaker. The Rack Amplifier `CAB` slot switches only its cabinet simulation, \
which is a stage within the effect, so it is a plain switch here.

Note that the Noise Gate reads the other way round: effects.toml records its \
`min` as ON and its `max` as OFF, which is the manual's own ordering.

There is no slot-level off outside these three; see the note on the fx_type \
table in enums.toml."""

