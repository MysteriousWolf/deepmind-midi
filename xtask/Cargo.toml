[package]
name = "xtask"
description = "Repository automation: documentation generation from the spec files and release version bumps"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

# Deliberately not the workspace lint set. The no-panic rules exist to keep the
# library safe against untrusted MIDI input; xtask is a build tool, where a panic
# is an acceptable and loud failure.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
