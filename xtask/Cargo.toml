[package]
name = "xtask"
description = "Generates the documentation and the library's parameter tables from the spec files"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

# The library's own tables are checked against the spec files here, where the
# spec loader already lives. Nothing in the generator depends on the library.
[dev-dependencies]
deepmind-midi = { path = "../deepmind-midi" }

# Deliberately not the workspace lint set. The no-panic rules exist to keep the
# library safe against untrusted MIDI input; xtask is a build tool, where a panic
# is an acceptable and loud failure.
[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
