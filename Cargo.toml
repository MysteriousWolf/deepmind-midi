[workspace]
members = ["deepmind-midi", "xtask"]
# `cargo fuzz` builds this one on nightly with sanitizer flags, and the library
# must not inherit them.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "26.3.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/MysteriousWolf/deepmind-midi"
authors = ["MysteriousWolf"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
module_name_repetitions = "allow"
