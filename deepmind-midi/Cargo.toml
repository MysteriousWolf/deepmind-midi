[package]
name = "deepmind-midi"
description = "Sans-IO protocol library for Behringer DeepMind synthesizers: SysEx, NRPN, programs and device state"
categories = ["encoding", "no-std", "parser-implementations"]
keywords = ["midi", "sysex", "synthesizer", "deepmind", "behringer"]
readme = "../README.md"
documentation = "https://docs.rs/deepmind-midi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
## Implies `alloc`, and adds the standard-library clock to `transport`.
std = ["alloc"]
## Enables APIs that allocate (bank decoding, `.syx` file handling).
alloc = []
## Derives `Serialize`/`Deserialize` on the public data types.
serde = ["dep:serde"]
## Enables the blocking adapter: a port trait, a clock trait and the loop between
## them. Needs neither `std` nor an allocator.
transport = []
## Enables a simulated synthesizer to drive a host against, for tests that have
## no `DeepMind` plugged in. Needs neither `std` nor an allocator.
sim = []
## Adds the sentence saying what a parameter or an effect slot does, which the
## `description` accessors answer `None` for without it. Off by default: prose
## is what a host with somewhere to print it wants and a microcontroller does
## not, and the signature is the same either way.
descriptions = []

[dependencies]
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
serde_json = "1"

# Tests that need features beyond the default are skipped rather than failed
# when those features are off, so `cargo test -p deepmind-midi` builds.
[[test]]
name = "conversation"
required-features = ["sim", "transport"]

[[test]]
name = "serde"
required-features = ["serde"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
