[package]
name = "deepmind-midi"
description = "Sans-IO protocol library for Behringer DeepMind synthesizers: SysEx, NRPN, programs and device state"
categories = ["encoding", "no-std", "parser-implementations"]
keywords = ["midi", "sysex", "synthesizer", "deepmind", "behringer"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["std"]
## Enables `std::error::Error` impls and owned collection helpers.
std = ["alloc"]
## Enables APIs that allocate (bank decoding, `.syx` file handling).
alloc = []
## Derives `Serialize`/`Deserialize` on the public data types.
serde = ["dep:serde"]
## Enables the blocking adapter: a port trait, a clock trait and the loop between
## them. Needs neither `std` nor an allocator.
transport = []
## Enables a simulated synthesizer to drive a host against, for tests that have
## no `DeepMind` plugged in. Needs neither `std` nor an allocator.
sim = []

[dependencies]
serde = { version = "1", optional = true, default-features = false, features = ["derive"] }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
